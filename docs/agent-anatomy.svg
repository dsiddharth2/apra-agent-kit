<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" style="font-family:system-ui,-apple-system,sans-serif;background:#ffffff">

  <!-- Agent boundary -->
  <rect x="100" y="50" width="520" height="310" rx="16" fill="none" stroke="#1f2937" stroke-width="2.5" stroke-dasharray="8 4"/>
  <text x="120" y="78" font-size="14" font-weight="700" fill="#1f2937" letter-spacing="0.08em">AGENT</text>

  <!-- Task arrow in -->
  <line x1="20" y1="205" x2="96" y2="205" stroke="#6b7280" stroke-width="2" marker-end="url(#arw)"/>
  <text x="12" y="195" font-size="12" font-weight="600" fill="#374151">Task</text>

  <!-- Result arrow out -->
  <line x1="624" y1="205" x2="700" y2="205" stroke="#6b7280" stroke-width="2" marker-end="url(#arw)"/>
  <text x="660" y="195" font-size="12" font-weight="600" fill="#374151">Result</text>

  <defs>
    <marker id="arw" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="9" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- ======== ROW 1: Memory | Run Loop | Workflows ======== -->

  <!-- 1. Run Loop (center, SHIPPED — teal) -->
  <rect x="250" y="100" width="220" height="80" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <circle cx="270" cy="118" r="10" fill="#059669"/>
  <text x="270" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
  <text x="370" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#059669">Run Loop</text>
  <text x="370" y="146" text-anchor="middle" font-size="10" fill="#374151">plan · act · observe · replan</text>
  <text x="370" y="162" text-anchor="middle" font-size="9" fill="#059669" font-weight="600">ReAct + Plan-Execute</text>

  <!-- 2. Memory (left, PARTIAL — half teal half grey) -->
  <rect x="120" y="100" width="116" height="80" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="120" y="100" width="116" height="26" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <rect x="120" y="116" width="116" height="10" rx="0" fill="#d1fae5"/>
  <circle cx="140" cy="118" r="10" fill="#6b7280"/>
  <text x="140" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
  <text x="178" y="122" font-size="13" font-weight="700" fill="#059669">Memory</text>
  <text x="178" y="142" font-size="9" fill="#059669">working context ✓</text>
  <text x="178" y="155" font-size="9" fill="#9ca3af">run state — planned</text>
  <text x="178" y="168" font-size="9" fill="#9ca3af">long-term — planned</text>

  <!-- 3. Workflows (right, SHIPPED — teal) -->
  <rect x="484" y="100" width="116" height="80" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <circle cx="504" cy="118" r="10" fill="#059669"/>
  <text x="504" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
  <text x="542" y="122" font-size="13" font-weight="700" fill="#059669">Workflows</text>
  <text x="542" y="142" font-size="9" fill="#374151">Known paths,</text>
  <text x="542" y="155" font-size="9" fill="#374151">exposed as tools</text>

  <!-- ======== ROW 2: Tools | Budgets | Guardrails ======== -->

  <!-- 4. Tools (left, SHIPPED — blue) -->
  <rect x="120" y="200" width="160" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="140" cy="218" r="10" fill="#2563eb"/>
  <text x="140" y="222" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
  <text x="200" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb">Tools</text>
  <text x="200" y="242" text-anchor="middle" font-size="9" fill="#374151">Typed schemas, described</text>
  <text x="200" y="255" text-anchor="middle" font-size="9" fill="#2563eb" font-weight="600">15 Python tools</text>

  <!-- 5. Budgets & Stops (center, SHIPPED — amber) -->
  <rect x="296" y="200" width="160" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <circle cx="316" cy="218" r="10" fill="#d97706"/>
  <text x="316" y="222" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text>
  <text x="376" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#d97706">Budgets &amp; Stops</text>
  <text x="376" y="242" text-anchor="middle" font-size="9" fill="#374151">Iteration, cost, token caps</text>
  <text x="376" y="255" text-anchor="middle" font-size="9" fill="#374151">Explicit done condition</text>

  <!-- 6. Guardrails (right, SHIPPED — rose) -->
  <rect x="472" y="200" width="128" height="70" rx="10" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
  <circle cx="492" cy="218" r="10" fill="#e11d48"/>
  <text x="492" y="222" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">6</text>
  <text x="536" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#e11d48">Guardrails</text>
  <text x="536" y="242" text-anchor="middle" font-size="9" fill="#374151">Permissions, sandbox</text>
  <text x="536" y="255" text-anchor="middle" font-size="9" fill="#374151">Reversibility checks</text>

  <!-- ======== Evals (OUTSIDE boundary, NOT BUILT — grey) ======== -->
  <rect x="120" y="296" width="480" height="50" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="360" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#9ca3af">Evals</text>
  <text x="360" y="334" text-anchor="middle" font-size="9" fill="#9ca3af">Harness that calls the whole box and grades what comes out — planned for Phase 3</text>

  <!-- ======== Legend ======== -->
  <rect x="160" y="382" width="14" height="14" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="180" y="394" font-size="10" fill="#374151">Shipped</text>

  <rect x="280" y="382" width="14" height="14" rx="3" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="300" y="394" font-size="10" fill="#374151">Partial</text>

  <rect x="390" y="382" width="14" height="14" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="410" y="394" font-size="10" fill="#9ca3af">Planned</text>

</svg>
