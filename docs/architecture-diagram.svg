<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 650" width="780" height="650" style="font-family:system-ui,-apple-system,sans-serif;background:#ffffff">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Client -->
  <rect x="310" y="14" width="160" height="40" rx="20" fill="#f0f4f8" stroke="#c7d2e0" stroke-width="1.5"/>
  <text x="390" y="39" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Client</text>

  <!-- Arrow: Client → HTTP -->
  <line x1="390" y1="54" x2="390" y2="84" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="76" font-size="10" fill="#374151" font-family="monospace">POST /task · POST /mcp</text>

  <!-- HTTP Layer -->
  <rect x="240" y="88" width="300" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="390" y="107" text-anchor="middle" font-size="13" font-weight="600" fill="#2563eb">HTTP Layer</text>
  <text x="390" y="124" text-anchor="middle" font-size="10" fill="#374151">Express · Raw HTTP · Azure Functions</text>

  <!-- Left: to Job Queue -->
  <line x1="330" y1="134" x2="200" y2="179" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="244" y="156" font-size="10" fill="#374151">async</text>

  <!-- Right: to MCP -->
  <line x1="450" y1="134" x2="600" y2="179" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="536" y="156" font-size="10" fill="#374151" font-family="monospace">/mcp</text>

  <!-- Center: sync -->
  <line x1="390" y1="134" x2="390" y2="274" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-blue)"/>
  <text x="396" y="204" font-size="10" fill="#2563eb">sync (wait=true)</text>

  <!-- Job Queue -->
  <rect x="80" y="182" width="240" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="200" y="204" text-anchor="middle" font-size="13" font-weight="600" fill="#d97706">Job Queue</text>
  <text x="200" y="222" text-anchor="middle" font-size="10" fill="#374151">SQLite FIFO (VM / Docker)</text>
  <text x="200" y="236" text-anchor="middle" font-size="10" fill="#374151">Azure Durable Functions (Cloud)</text>

  <!-- Arrow: Job Queue → Strategy -->
  <line x1="200" y1="252" x2="200" y2="274" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="200" y1="274" x2="345" y2="274" stroke="#6b7280" stroke-width="1.5"/>

  <!-- MCP Server -->
  <rect x="530" y="182" width="200" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="630" y="204" text-anchor="middle" font-size="13" font-weight="600" fill="#7c3aed">MCP Server</text>
  <text x="630" y="221" text-anchor="middle" font-size="10" fill="#374151">15-tool catalog for external AI</text>

  <!-- Arrow: MCP → Worker Pool (skips strategy) -->
  <line x1="630" y1="232" x2="630" y2="394" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="630" y1="394" x2="535" y2="394" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="636" y="324" font-size="10" fill="#374151">tool call</text>

  <!-- Strategy Engine -->
  <rect x="260" y="278" width="260" height="70" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="390" y="300" text-anchor="middle" font-size="13" font-weight="600" fill="#059669">Strategy Engine</text>
  <text x="330" y="320" text-anchor="middle" font-size="11" fill="#374151">ReAct</text>
  <text x="390" y="320" text-anchor="middle" font-size="11" fill="#374151">·</text>
  <text x="450" y="320" text-anchor="middle" font-size="11" fill="#374151">Plan-Execute</text>
  <text x="390" y="338" text-anchor="middle" font-size="10" fill="#374151">LLM picks tools, observes, replans</text>

  <!-- Budgets & Guardrails -->
  <rect x="48" y="286" width="170" height="50" rx="8" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/>
  <text x="133" y="307" text-anchor="middle" font-size="12" font-weight="600" fill="#e11d48">Budgets &amp; Guardrails</text>
  <text x="133" y="323" text-anchor="middle" font-size="10" fill="#374151">cost · tokens · time · policies</text>
  <line x1="218" y1="311" x2="256" y2="311" stroke="#e11d48" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Notifications -->
  <rect x="48" y="364" width="170" height="50" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <text x="133" y="385" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Notifications</text>
  <text x="133" y="401" text-anchor="middle" font-size="10" fill="#374151">SSE stream · Webhook POST</text>

  <!-- Arrow: Job Queue → Notifications (events flow down) -->
  <line x1="133" y1="364" x2="133" y2="252" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="110" y="330" font-size="9" fill="#374151">events</text>

  <!-- Arrow: Notifications → Client (SSE/Webhook callback) -->
  <polyline points="48,389  24,389  24,34  310,34" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="28" y="200" font-size="10" fill="#334155" transform="rotate(-90 28,200)">SSE · Webhook callback</text>

  <!-- Arrow: Strategy → Worker Pool -->
  <line x1="390" y1="348" x2="390" y2="376" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="396" y="366" font-size="10" fill="#374151">dispatch</text>

  <!-- Worker Pool -->
  <rect x="280" y="380" width="260" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="410" y="402" text-anchor="middle" font-size="13" font-weight="600" fill="#2563eb">Worker Pool</text>
  <text x="410" y="420" text-anchor="middle" font-size="10" fill="#374151">Pool (4 pairs) → Ephemeral (10) → Wait Queue (20)</text>
  <text x="410" y="434" text-anchor="middle" font-size="10" fill="#374151">each pair = doer + reviewer</text>

  <!-- Arrow: Worker Pool → Fleet -->
  <line x1="390" y1="440" x2="390" y2="472" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="396" y="460" font-size="10" fill="#374151">lease</text>

  <!-- Apra Fleet -->
  <rect x="260" y="476" width="260" height="50" rx="8" fill="#f0f4f8" stroke="#c7d2e0" stroke-width="1.5"/>
  <text x="390" y="498" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Apra Fleet</text>
  <text x="390" y="514" text-anchor="middle" font-size="10" fill="#374151">stdio MCP · member registry · OAuth</text>

  <!-- Arrow: Fleet → Claude + Tools -->
  <line x1="340" y1="526" x2="240" y2="566" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="526" x2="540" y2="566" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="270" y="548" font-size="10" fill="#374151">spawns</text>
  <text x="505" y="548" font-size="10" fill="#374151">executes</text>

  <!-- Claude Code -->
  <rect x="140" y="570" width="200" height="42" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="240" y="592" text-anchor="middle" font-size="13" font-weight="600" fill="#7c3aed">Claude Code</text>
  <text x="240" y="606" text-anchor="middle" font-size="10" fill="#374151">LLM reasoning instances</text>

  <!-- Tools -->
  <rect x="440" y="570" width="200" height="42" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="540" y="592" text-anchor="middle" font-size="13" font-weight="600" fill="#059669">Python Tools</text>
  <text x="540" y="606" text-anchor="middle" font-size="10" fill="#374151">weather · currency · geo · ...</text>

  <!-- Legend -->
  <text x="390" y="636" text-anchor="middle" font-size="9" fill="#6b7280">Request flows top-to-bottom. Dashed lines = alternate paths (sync skip, MCP direct tool call).</text>
</svg>
