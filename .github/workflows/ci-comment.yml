name: CI — Post load test report

# Runs in the base repo's context after CI completes, so GITHUB_TOKEN has
# write permission even when the PR comes from a fork.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  pull-requests: write

jobs:
  post-comment:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download load test report artifact
        uses: actions/download-artifact@v4
        with:
          name: load-test-report
          path: /tmp/load-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post load test report to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumber = Number(fs.readFileSync('/tmp/load-report/pr_number', 'utf8').trim());
            const report = JSON.parse(fs.readFileSync('/tmp/load-report/report.json', 'utf8'));

            const sections = [
              '## Load Test Results',
              '',
              '### Dispatch tiers (pool=2, ephemeral=3, 8 concurrent inspect-members)',
              '```',
              report.dispatch || '(no output)',
              '```',
              '',
              '### Full capacity (20 concurrent inspect-members)',
              '```',
              report.full || '(no output)',
              '```',
            ];

            if (report.e2e) {
              sections.push(
                '',
                '### End-to-end city-briefing (8 concurrent, LLM + weather + timezone)',
                '```',
                report.e2e,
                '```',
              );
            } else {
              sections.push(
                '',
                '> **Note:** city-briefing load test skipped — `CLAUDE_CODE_OAUTH_TOKEN` secret not configured.',
              );
            }

            const body = sections.join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const marker = '## Load Test Results';
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.startsWith(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
