name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  create-command:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Generator unit tests
        run: |
          node --test \
            tests/create-doctor.test.mjs \
            tests/create-copy.test.mjs \
            tests/create-substitute.test.mjs \
            tests/create-prompt.test.mjs \
            tests/create-template.test.mjs \
            tests/create-cli.test.mjs \
            tests/create-packaging.test.mjs
      - name: Generate a project and run its suite
        run: node --test tests/create-e2e.test.mjs

  # Fast job — no Fleet, no Docker. Runs pool/dispatcher/config unit tests.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  # Full job — builds the Docker image with Fleet installed, runs the
  # complete test suite (unit + integration) and load tests inside it.
  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      HAS_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t apra-agent-kit-ci .

      - name: Run full test suite (unit + integration)
        run: |
          docker run --rm apra-agent-kit-ci \
            node --test \
              tests/transport-stdio-fleet.test.mjs \
              tests/pool-roster.test.mjs \
              tests/pool-cleanup.test.mjs \
              tests/pool-worker-lock.test.mjs \
              tests/pool-fleet-text.test.mjs \
              tests/pool-pooled-fleet-api.test.mjs \
              tests/pool-worker-pool.test.mjs \
              tests/pool-config.test.mjs \
              tests/pool-member-manager.test.mjs \
              tests/pool-ephemeral-factory.test.mjs \
              tests/pool-worker-dispatcher.test.mjs \
              tests/pool-index.test.mjs \
              tests/demo.test.mjs \
              tests/inspect-members.test.mjs \
              tests/mcp.test.mjs

      - name: Load test — dispatch tiers (pool=2, ephemeral=3, 8 concurrent)
        run: |
          docker run --rm \
            -e WORKER_POOL_SIZE=2 \
            -e WORKER_EPHEMERAL_MAX=3 \
            -e WORKER_DISPATCH_QUEUE_SIZE=10 \
            apra-agent-kit-ci \
            node tests/load-test.mjs --tool inspect-members --concurrency 8

      - name: Load test — full capacity (20 concurrent inspect-members)
        run: |
          docker run --rm \
            apra-agent-kit-ci \
            node tests/load-test.mjs --tool inspect-members --concurrency 20

      - name: Load test — city-briefing end-to-end (8 concurrent)
        if: ${{ env.HAS_OAUTH_TOKEN == 'true' }}
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          docker run --rm \
            -e CLAUDE_CODE_OAUTH_TOKEN \
            -e WORKER_POOL_SIZE=2 \
            -e WORKER_EPHEMERAL_MAX=3 \
            -e WORKER_DISPATCH_QUEUE_SIZE=10 \
            apra-agent-kit-ci \
            node tests/load-test.mjs --tool city-briefing --city London --concurrency 8
